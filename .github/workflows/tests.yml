name: "CI"

on:
  [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
    - run: npm run test

      env:
        TZ: "Europe/Prague"

  playwright-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
        shardIndex: [1, 2]
        shardTotal: [2]
    defaults:
      run:
        working-directory: e2e/client
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Setup E2E Environment
      uses: ./.github/actions/setup-e2e

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

    - name: Upload blob report to Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: e2e/client/blob-report
        retention-days: 1

    - name: Server Logs
      if: ${{ failure() }}
      run: docker compose logs server
      working-directory: e2e/server

  merge-playwright-reports:
    if: ${{ !cancelled() }}
    needs: [playwright-e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/client
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Download blob reports from Artifacts
      uses: actions/download-artifact@v5
      with:
        path: e2e/client/all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    - name: Merge into HTML Report
      run: npx playwright merge-reports --reporter html ./all-blob-reports

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: e2e/client/playwright-report
        retention-days: 14

  protractor-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
        suite: [a, b]
    defaults:
      run:
        working-directory: e2e/client
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Setup E2E Environment
      uses: ./.github/actions/setup-e2e

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
      id: setup-chrome
      with:
        chrome-version: 127.0.6533.99
        install-dependencies: true
        install-chromedriver: true

    - name: Run Protractor
      run: npx protractor-flake --parser standard --max-attempts=3 -- protractor.conf.js --suite=${{ matrix.suite }}
      env:
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        CHROMEWEBDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        TRAVIS: ci
        SCREENSHOTS_DIR: /tmp

    - name: Upload screenshots
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: screenshots-protractor-node-${{ matrix.node-version }}-${{ matrix.suite }}
        path: /tmp/*.png

    - name: Server Logs
      if: ${{ failure() }}
      run: docker compose logs server
      working-directory: e2e/server
