name: "CI"

on:
  [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci

    # must come after npm ci, which deletes node_modules
    - name: Cache webpack build cache
      uses: actions/cache@v5.0.5
      with:
        path: node_modules/.cache
        key: webpack-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'webpack.config.js') }}
        restore-keys: |
          webpack-${{ runner.os }}-node${{ matrix.node-version }}-

    - run: npm run test

      env:
        TZ: "Europe/Prague"

  prepare-e2e-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Build superdesk server
      run: docker build -t superdesk-client-core-e2e-server:ci .
      working-directory: e2e/server

    - name: Archive e2e server images
      run: |
        docker save \
          superdesk-client-core-e2e-server:ci | gzip > /tmp/e2e-server-images.tar.gz

    - name: Upload e2e server images
      uses: actions/upload-artifact@v7
      with:
        name: e2e-server-images
        path: /tmp/e2e-server-images.tar.gz
        retention-days: 1

  prepare-e2e-client:
    runs-on: ubuntu-latest
    env:
      # CI runs the e2e server on :5000 (docker-compose PORT default; no AirPlay
      # conflict on Linux). The test helpers and client build read SUPERDESK_URL,
      # which defaults to 5002 locally to dodge macOS AirPlay; pin it to the CI port.
      SUPERDESK_URL: http://localhost:5000/api
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          build-tools/package-lock.json
          e2e/client/package-lock.json

    - name: Install root dependencies
      run: npm ci
    - name: Install build-tools dependencies
      run: npm ci
      working-directory: build-tools
    - name: Install e2e client dependencies
      run: npm ci
      working-directory: e2e/client

    # must come after npm ci, which deletes node_modules
    - name: Cache webpack build cache
      uses: actions/cache@v5.0.5
      with:
        path: e2e/client/node_modules/.cache
        key: webpack-e2e-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('e2e/client/package-lock.json', 'webpack.config.js') }}
        restore-keys: |
          webpack-e2e-${{ runner.os }}-node${{ matrix.node-version }}-

    - run: npm run build
      working-directory: e2e/client

    - name: Upload e2e client dist
      uses: actions/upload-artifact@v7
      with:
        name: e2e-client-dist-node-${{ matrix.node-version }}
        path: e2e/client/dist
        retention-days: 1

  playwright-e2e:
    runs-on: ubuntu-latest
    needs:
    - prepare-e2e-server
    - prepare-e2e-client
    env:
      # CI runs the e2e server on :5000 (docker-compose PORT default; no AirPlay
      # conflict on Linux). The test helpers and client build read SUPERDESK_URL,
      # which defaults to 5002 locally to dodge macOS AirPlay; pin it to the CI port.
      SUPERDESK_URL: http://localhost:5000/api
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    defaults:
      run:
        working-directory: e2e/client

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          build-tools/package-lock.json
          e2e/client/package-lock.json

    - name: Download e2e client dist
      uses: actions/download-artifact@v8
      with:
        name: e2e-client-dist-node-${{ matrix.node-version }}
        path: e2e/client/dist

    - name: Download e2e server images
      uses: actions/download-artifact@v8
      with:
        name: e2e-server-images
        path: /tmp/e2e-server-images

    - name: Load e2e server images
      run: gunzip -c /tmp/e2e-server-images/e2e-server-images.tar.gz | docker load

    - name: Setup E2E Environment
      uses: ./.github/actions/setup-e2e

    - name: Resolve Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers and system deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      timeout-minutes: 15
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system deps only
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      timeout-minutes: 15
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: npx playwright install-deps chromium

    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

    - name: Upload blob report to Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: blob-report-node-${{ matrix.node-version }}-shard-${{ matrix.shardIndex }}
        path: e2e/client/blob-report
        retention-days: 1

    - name: Server Logs
      if: ${{ failure() }}
      run: docker compose logs server
      working-directory: e2e/server

  merge-playwright-reports:
    if: ${{ !cancelled() }}
    needs: [playwright-e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/client
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Download blob reports from Artifacts
      uses: actions/download-artifact@v8
      with:
        path: e2e/client/all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    - name: Merge into HTML Report
      run: npx playwright merge-reports --reporter html ./all-blob-reports

    - name: Upload HTML report
      uses: actions/upload-artifact@v7
      with:
        name: playwright-html-report
        path: e2e/client/playwright-report
        retention-days: 14
