name: "CI"

on:
  [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci

    # must come after npm ci, which deletes node_modules
    - name: Cache webpack build cache
      uses: actions/cache@v5.0.5
      with:
        path: node_modules/.cache
        key: webpack-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'webpack.config.js') }}
        restore-keys: |
          webpack-${{ runner.os }}-node${{ matrix.node-version }}-

    - name: Install content-lists extension dependencies
      run: npm ci
      working-directory: scripts/extensions/content-lists

    - run: npm run test

      env:
        TZ: "Europe/Prague"

    - name: Run content-lists extension unit tests
      run: npm run test
      working-directory: scripts/extensions/content-lists
      env:
        TZ: "Europe/Prague"
