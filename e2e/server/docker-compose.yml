name: superdesk-client-core_e2e

services:
    redis:
        image: redis:alpine
        network_mode: "host"

    mongo:
        image: mongo:6
        network_mode: "host"
        # The default container soft nofile limit is 1024. e2e specs call
        # restore_record before each test, which drops and recreates every
        # collection + index; WiredTiger keeps a file per collection/index, so
        # over a full suite run the descriptors exhaust and mongod aborts with
        # a WT_PANIC ("Too many open files"). MongoDB recommends >= 64000.
        ulimits:
            nofile:
                soft: 64000
                hard: 64000
        environment:
            - MONGO_INITDB_DATABASE=superdesk_e2e
        tmpfs:
            - /data/db
        volumes:
          - ./mongo-rs-initialize.js:/docker-entrypoint-initdb.d/mongo-rs-initialize.js:ro
        command: --replSet rs0

    elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
        network_mode: "host"
        environment:
            - discovery.type=single-node
            - action.auto_create_index=false
            - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
        tmpfs:
            - /usr/share/elasticsearch/data

    mail:
        image: marlonb/mailcrab:latest
        network_mode: "host"

    server:
        image: superdesk-client-core-e2e-server:ci
        # Built locally (or loaded from a CI artifact); the name has no
        # registry namespace, so any pull attempt is guaranteed to fail.
        pull_policy: never
        network_mode: "host"
        environment:
            - PORT=${PORT:-5000}
            - SERVER_NAME=${SERVER_NAME:-localhost:5000}
            - REDIS_URL=redis://localhost:6379/1
            - ELASTICSEARCH_URL=http://localhost:9200
            - MONGO_URI=mongodb://localhost/superdesk_e2e
            - ARCHIVED_URI=mongodb://localhost/superdesk_e2e_archived
            - LEGAL_ARCHIVE_URI=mongodb://localhost/superdesk_e2e_legal_archive
            - PUBLICAPI_MONGO_URI=mongodb://localhost/publicapi_e2e
            - CONTENTAPI_MONGO_URI=mongodb://localhost/contentapi_e2e
            - WEB_WORKERS=2
            - WEB_TIMEOUT=30
            - WEB_LOG_LEVEL=info
            - CELERY_ALWAYS_EAGER=true
            - MAIL_PORT=1025
        volumes:
          - ./dump:/opt/superdesk/dump:rw
          # The image bakes settings.py in at build time (Dockerfile COPY), and
          # e2e-up.sh only builds the image when it is missing, so a prebuilt
          # image keeps running a stale copy forever. Mount the current file so
          # the stack always runs the env-driven settings: without it
          # MEDIA_PREFIX keeps the port the snapshots were recorded on and
          # every rendition 404s on a stack served from any other port.
          - ./settings.py:/opt/superdesk/settings.py:ro
        user: 1000:1000
