<fieldset ng-if="context">
    <div class="superdeskRepos flex-grid flex-grid--boxed-small flex-grid--wrap-items flex-grid--small-2" ng-show="repo.search === 'local'">
        <button type="button" id="ingest-collection" data-test-id="repo--ingest" class="toggle-button" ng-click="toggleRepo('ingest')" ng-class="{'toggle-button--active': repo.ingest}" aria-pressed="{{repo.ingest ? true : false}}">{{:: 'Ingest' | translate}}</button>
        <button type="button" id="archive-collection" data-test-id="repo--production" class="toggle-button" ng-click="toggleRepo('archive')" ng-class="{'toggle-button--active': repo.archive}" aria-pressed="{{repo.archive ? true : false}}">{{:: 'Production' | translate}}</button>
        <button type="button" id="published-collection" data-test-id="repo--published" class="toggle-button" ng-click="toggleRepo('published')" ng-class="{'toggle-button--active': repo.published}" aria-pressed="{{repo.published ? true : false}}">{{:: 'Published' | translate}}</button>
        <button type="button" id="archived-collection" data-test-id="repo--archived" class="toggle-button" ng-click="toggleRepo('archived')" ng-class="{'toggle-button--active': repo.archived}" aria-pressed="{{repo.archived ? true : false}}">{{:: 'Archived' | translate}}</button>
    </div>
</fieldset>
